<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎂 Happy 5th Monthsary Hubby 💙 - Cake Celebration</title>
    <!-- External stylesheet -->
    <link rel="stylesheet" href="page2.css">
    <!-- External JavaScript -->
    <script src="page2.js" defer></script>
</head>
<body>
    <!-- ============================================ -->
    <!-- CAKE CELEBRATION - Full Screen Hero Section   -->
    <!-- ============================================ -->
    <section class="cake-hero" id="cakeHero">
        
        <!-- ========================================== -->
        <!-- MAIN CONTENT CONTAINER                    -->
        <!-- ========================================== -->
        <div class="cake-content">

            <!-- Main Title -->
            <h1 class="main-title">🎂 Happy 5th Monthsary Hubby 💙</h1>

            <!-- Subtitle -->
            <p class="subtitle">
                "Let's celebrate another beautiful month together."
            </p>

            <!-- ========================================== -->
            <!-- GREETING TEXT ABOVE THE CAKE              -->
            <!-- ========================================== -->
            <p class="greeting-text" id="greetingText">
                Make a wish before blowing the candles.
            </p>

            <!-- ========================================== -->
            <!-- DECORATIVE CAKE CONTAINER                 -->
            <!-- ========================================== -->
            <div class="cake-container" id="cakeContainer">
                
                <!-- Cake layers will be styled with CSS -->
                <!-- CUSTOMIZE: Add your own cake text/message here -->
                <div class="cake" id="cake">
                    
                    <!-- Cake Stand -->
                    <div class="cake-stand" id="cakeStand"></div>
                    
                    <!-- Bottom Layer (Blue Frosting) -->
                    <div class="cake-layer layer-bottom" id="layerBottom">
                        <!-- CUSTOMIZE: Add decorative text or details for bottom layer -->
                        <span class="layer-text">💙</span>
                    </div>
                    
                    <!-- Middle Layer (White Frosting) -->
                    <div class="cake-layer layer-middle" id="layerMiddle">
                        <!-- CUSTOMIZE: Add decorative text or details for middle layer -->
                        <span class="layer-text">🤍</span>
                    </div>
                    
                    <!-- Top Layer (Black Decorative Details) -->
                    <div class="cake-layer layer-top" id="layerTop">
                        <!-- CUSTOMIZE: Add decorative text or details for top layer -->
                        <span class="layer-text">🖤</span>
                    </div>
                    
                    <!-- ========================================== -->
                    <!-- CANDLES SECTION                          -->
                    <!-- ========================================== -->
                    <div class="candles-container" id="candlesContainer">
                        <!-- Five Candles with Flames -->
                        <!-- Candle 1 -->
                        <div class="candle" id="candle1">
                            <div class="candle-body"></div>
                            <div class="candle-flame" id="flame1"></div>
                        </div>
                        <!-- Candle 2 -->
                        <div class="candle" id="candle2">
                            <div class="candle-body"></div>
                            <div class="candle-flame" id="flame2"></div>
                        </div>
                        <!-- Candle 3 -->
                        <div class="candle" id="candle3">
                            <div class="candle-body"></div>
                            <div class="candle-flame" id="flame3"></div>
                        </div>
                        <!-- Candle 4 -->
                        <div class="candle" id="candle4">
                            <div class="candle-body"></div>
                            <div class="candle-flame" id="flame4"></div>
                        </div>
                        <!-- Candle 5 -->
                        <div class="candle" id="candle5">
                            <div class="candle-body"></div>
                            <div class="candle-flame" id="flame5"></div>
                        </div>
                    </div>
                    
                </div>
            </div>

            <!-- ========================================== -->
            <!-- BLOW THE CANDLES BUTTON                   -->
            <!-- ========================================== -->
            <button class="btn-blow" id="blowButton">
                🕯 Blow the Candles
            </button>

            <!-- ========================================== -->
            <!-- HIDDEN CELEBRATION MESSAGE CONTAINER      -->
            <!-- ========================================== -->
            <div class="celebration-message hidden" id="celebrationMessage">
                <p class="celebration-text">
                    🎉 Happy 5th Monthsary! 🎉
                </p>
                <!-- CUSTOMIZE: Add your own celebration message here -->
                <p class="celebration-subtext">
                    "Here's to many more beautiful months together!"
                </p>
            </div>

            <!-- ========================================== -->
            <!-- HIDDEN CONTINUE BUTTON                    -->
            <!-- ========================================== -->
            <a href="page3.html" class="btn-continue hidden" id="continueButton">
                Continue Our Journey 💙
            </a>

        </div>

        <!-- ========================================== -->
        <!-- DECORATIVE / ANIMATION CONTAINERS          -->
        <!-- ========================================== -->
        
        <!-- Hidden Confetti Container -->
        <div class="confetti-container hidden" id="confettiContainer" aria-hidden="true"></div>
        
        <!-- Hidden Fireworks Container -->
        <div class="fireworks-container hidden" id="fireworksContainer" aria-hidden="true"></div>
        
        <!-- Hidden Floating Hearts Container -->
        <div class="floating-hearts-container hidden" id="floatingHeartsContainer" aria-hidden="true"></div>
        
        <!-- Background Decorative Elements -->
        <div class="decorative-elements" id="decorativeElements" aria-hidden="true"></div>
        
    </section>

    <!-- ========================================== -->
    <!-- FOOTER                                     -->
    <!-- ========================================== -->
    <footer class="cake-footer">
        <p class="footer-message">Made with 💙 for you.</p>
    </footer>
</body>
</html>
